# uv alternative to environments/py311_cu128.yaml; see the README.
# To target a different CUDA build, change the index URL below and the torch pin to a
# version that index carries (cu126 and cu129 also ship 2.8.0; cu118 stops at 2.7.1 and
# cu130 starts at 2.9.0). A different CUDA major also needs the cuda-python pin changed,
# as environments/py311_cu118.yaml does.
[project]
name = "nerficg"
version = "2.0.0"
description = "A flexible PyTorch framework for radiance field and view synthesis methods."
requires-python = "==3.11.*"
dependencies = [
    "torch==2.8.0",
    "torchvision",
    "numpy",
    "tqdm",
    "natsort",
    "pyyaml",
    "munch",
    "tabulate",
    "wandb",
    "opencv-python",
    "kornia",
    "torchmetrics",
    "lpips",
    "einops",
    "setuptools==80.10.2",
    "plyfile",
    "matplotlib",
    "timm",
    "plotly",
    "pillow",
    "jax",
    "pyproj",
    "scikit-learn",
    "pycolmap",
    # The extension modules shell out to a bare `pip install <extension>`, and a uv
    # virtualenv has no pip of its own. `uv run` puts .venv/bin first on PATH, so this is
    # the pip they find.
    "pip",
    # gui
    "cuda-python==12.8.*",
    "PySDL3",
    "numpy-quaternion",
    "platformdirs",
    "imgui-bundle",
    "pyopengl",
]

[tool.uv]
# The framework is used from a source checkout via scripts/, not installed as a package.
package = false

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }
